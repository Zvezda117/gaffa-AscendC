name: gaffa
channels:
  - conda-forge
dependencies:
  - python=3.12
  - gcc_linux-64=13
  - gxx_linux-64=13
  - libgcc-ng>=13
  - libstdcxx-ng>=13
  - cmake>=3.26
  - ninja
  - conan>=2
  - just
  - scikit-build-core>=0.10
  - pybind11>=2.13
  - pytest>=8
  - pytest-cov
  - gcovr
  - ruff>=0.5
  - python-build
  - pip

# CANN/BiSheng is intentionally not installed by Conda. Install a compatible
# CANN development toolkit on the host (Atlas A2/A3) and source its set_env.sh
# before configuring or building GAFFA.
