[build-system]
requires = [
  "scikit-build-core>=0.10",
  "wheel",
  "cmake>=3.26",
  "ninja",
  "pybind11>=2.13",
  "conan>=2.0"
]
build-backend = "scikit_build_core.build"

[project]
name = "gaffa"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "lintian233" }]
description = "AscendC/C++ and Python library for pulsar processing and FFA searches."
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov",
  "ruff>=0.5",
]

[tool.scikit-build]
wheel.packages = ["python/gaffa"]
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake]
minimum-version = "3.26"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
GAFFA_ASCEND_ARCH = "dav-2201"

[tool.scikit-build.sdist]
include = [
  "CMakeLists.txt",
  "conanfile.py",
  "environment.yml",
  "env/**",
  "justfile",
  "include/**",
  "src/**",
  "python/**",
  "tests/**",
  "README_ASCEND.md",
]
exclude = [
  "build/**",
  "_skbuild/**",
  "dist/**",
  ".git/**",
  ".github/**",
]

# Wheel builds require a CANN development installation. Source CANN's
# set_env.sh before invoking cibuildwheel so find_package(ASC), BiSheng,
# acl/acl.h, and libascendcl are all visible to CMake.
[tool.cibuildwheel]
build = ["cp312-*"]
archs = ["x86_64"]
skip = ["*-musllinux_*", "pp*"]

[tool.cibuildwheel.linux]
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.environment]
CMAKE_BUILD_TYPE = "Release"
GAFFA_ASCEND_ARCH = "dav-2201"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
